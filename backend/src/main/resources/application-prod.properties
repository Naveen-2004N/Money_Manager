# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:${MONEY_MANAGER_POSTGRESQL_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MONEY_MANAGER_POSTGRESQL_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MONEY_MANAGER_POSTGRESQL_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

server.servlet.context-path=/api/v1.0
server.port=${PORT:8080}
