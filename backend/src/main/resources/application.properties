spring.application.name=moneyManager
debug=false

# MySQL Configuration - Creates the database automatically via Java/JDBC if it does not exist
spring.datasource.url=jdbc:mysql://localhost:3306/moneymanager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Naveen@12345
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

server.servlet.context-path=/api/v1.0
server.port=${PORT:8080}

# Spring Data JPA / Hibernate - Creates and updates all database tables automatically via Java Entity mappings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

money.manager.frontend.url=http://localhost:5173
