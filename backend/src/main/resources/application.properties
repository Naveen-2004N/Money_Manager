spring.application.name=moneyManager
debug=false

# Database Configuration - Supports Local MySQL and Cloud MySQL/PostgreSQL via env vars
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/moneymanager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Naveen@12345}

server.servlet.context-path=/api/v1.0
server.port=${PORT:8080}

# Spring Data JPA / Hibernate - Creates and updates all database tables automatically via Java Entity mappings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=true

money.manager.frontend.url=http://localhost:5173
